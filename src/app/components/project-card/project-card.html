<div class="project-card" [class.project-card--archived]="project().archived" (click)="onSelect()">
  <h3>
    {{ project().name }}
    @if (project().archived) {
      <span class="badge-archived">Archivé</span>
    }
  </h3>
  <p>{{ project().description }}</p>
  <span [class]="'status status--' + project().status">{{ project().status.replace('_', ' ') }}</span>
  <p class="tasks-info">{{ taskCount() }} Tâche(s) · {{ doneCount() }} terminées</p>

  <div class="card-actions">
    @if (project().archived) {
      <button type="button" class="btn-archive" (click)="onUnarchive($event)">
        Restaurer
      </button>
    } @else {
      <button
        type="button"
        class="btn-archive"
        [disabled]="!canArchive()"
        [title]="canArchive() ? 'Archiver ce projet' : 'Terminez toutes les tâches pour pouvoir archiver'"
        (click)="onArchive($event)"
      >
        Archiver
      </button>
    }
  </div>
</div>

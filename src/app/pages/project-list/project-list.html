<h1>Projects ({{ projects().length }})</h1>
<a routerLink="/projects/new">Nouveau projet</a>
<p>{{ activeProjectsCount() }} projet(s) actif(s)</p>

@if (projects().length === 0){
  <p class="empty-state">Aucun projet pour l'instant</p>
} @else {
  <div class="project-grid">
    @for (project of projects(); track project.id){
      <a [routerLink]="['/projects', project.id]">
        <app-project-card [project]="project" (selected)="onProjectSelected($event)"/>
      </a>
    }
  </div>
}
